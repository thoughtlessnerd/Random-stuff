<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient of physics</title>
    <style>
        *
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        div.gradient
        {
            width: 100%;
            height: 100vh;
            display: block;
            background: linear-gradient(to bottom right, rgb(149, 255, 108), rgb(160, 58, 255));
        }
    </style>
</head>
<body>
    <div class="gradient"></div>
</body>
</html>
